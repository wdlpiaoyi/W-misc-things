[[mods]]
modId="w_misc"
version="${mod_version}"
displayName="wdlpiaoyi's Miscellaneous Things"
authors="wdlpiaoyi"
logoFile="logo.png"
description='''
wdlpiaoyi's Miscellaneous Things —— 1.20.1 / Forge 的杂项复合模组。

把若干互相独立的小功能、兼容修补和跨模组联动集中在一个模组里，每个功能都能在
config/w_misc-common.toml 的 [features.*] 段单独开关；前置模组缺失时自动跳过对应模块。
'''

[[dependencies.w_misc]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.w_misc]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.20.2)"
    ordering="NONE"
    side="BOTH"

